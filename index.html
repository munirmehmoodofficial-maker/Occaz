<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="Occaz — Discover events, tickets and life-changing opportunities, beautifully curated." />
    <title>Occaz — Events, Tickets & Opportunities</title>
    <link rel="preconnect" href="https://picsum.photos" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Show any uncaught errors directly on the page so they're not invisible
      // (useful for debugging when the React app fails to mount).
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (!root || root.children.length > 0) return;
        root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui;background:#0a0a0f;color:#f4f4f5;">' +
          '<div style="max-width:600px;padding:24px;background:#15151c;border:1px solid #27272a;border-radius:16px;">' +
          '<h1 style="margin:0 0 8px;font-size:18px;">⚠️ App failed to load</h1>' +
          '<pre style="font-size:11px;line-height:1.5;padding:12px;background:#0a0a0f;border:1px solid #27272a;border-radius:8px;overflow:auto;color:#f87171;white-space:pre-wrap;">' +
          (e.error ? (e.error.name + ': ' + e.error.message + '\n\n' + (e.error.stack||'').split('\n').slice(0,5).join('\n')) : e.message) +
          '</pre></div></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (!root || root.children.length > 0) return;
        root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui;background:#0a0a0f;color:#f4f4f5;">' +
          '<div style="max-width:600px;padding:24px;background:#15151c;border:1px solid #27272a;border-radius:16px;">' +
          '<h1 style="margin:0 0 8px;font-size:18px;">⚠️ App failed to load (unhandled rejection)</h1>' +
          '<pre style="font-size:11px;line-height:1.5;padding:12px;background:#0a0a0f;border:1px solid #27272a;border-radius:8px;overflow:auto;color:#f87171;white-space:pre-wrap;">' +
          String(e.reason) + '</pre></div></div>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
